<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Single Note Strategist</title>
    <!-- ==========================================
         ファビコン・アイコン設定
    ========================================== -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons.png" />

    <!-- ==========================================
         基本メタタグ
    ========================================== -->
    <title>SINGLE NOTE STRATEGIST - 三国志×インナークロック鍛錬</title>
    <meta name="description" content="己の「インナークロック」を鍛え上げ、三国志の英雄たちと戦うストイックなリズムゲーム。完全ゼロ・レイテンシの環境で天下を統一せよ！" />

    <!-- ==========================================
         OGP設定 (note, Facebook等のプレビュー用)
    ========================================== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SINGLE NOTE STRATEGIST - 三国志×インナークロック鍛錬" />
    <meta property="og:description" content="己の「インナークロック」を鍛え上げ、三国志の英雄たちと戦うストイックなリズムゲーム。完全ゼロ・レイテンシの環境で天下を統一せよ！" />
    <meta property="og:site_name" content="SINGLE NOTE STRATEGIST" />
    
    <!-- ⚠️【重要】URLは必ず「https://〜」から始まる絶対パスに書き換えてください -->
    <meta property="og:url" content="https://single-note-rho.vercel.app/" />
    <meta property="og:image" content="https://single-note-rho.vercel.app/icons.png" />

    <!-- ==========================================
         X (旧Twitter) カード設定
    ========================================== -->
    <!-- icons.png が正方形の場合は "summary"、横長(1200x630等)の場合は "summary_large_image" に変更してください -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SINGLE NOTE STRATEGIST - 三国志×インナークロック鍛錬" />
    <meta name="twitter:description" content="己の「インナークロック」を鍛え上げ、三国志の英雄たちと戦うストイックなリズムゲーム。完全ゼロ・レイテンシの環境で天下を統一せよ！" />
    <meta name="twitter:image" content="https://single-note-rho.vercel.app/icons.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
